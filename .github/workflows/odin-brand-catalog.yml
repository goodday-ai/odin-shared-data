name: Odin brand catalog
on:
  push:
    branches: [main]
    paths:
      - 'data/odin/latest/availability_index_*.json'
      - '.github/scripts/build-brand-catalog*.mjs'
      - '.github/workflows/odin-brand-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odin-brand-catalog
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/build-brand-catalog*.mjs
            /data/odin/latest/availability_index_*.json
            /data/odin/latest/brand_catalog.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test .github/scripts/build-brand-catalog.test.mjs
      - name: Publish catalog from the latest indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git switch --detach --discard-changes FETCH_HEAD
            node .github/scripts/build-brand-catalog.mjs
            git add data/odin/latest/brand_catalog.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update Odin brand catalog'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
